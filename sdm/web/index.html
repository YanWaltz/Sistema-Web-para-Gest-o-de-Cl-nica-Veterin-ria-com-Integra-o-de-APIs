<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102a43"><title>SDM | Clínica veterinária</title><link rel="stylesheet" href="/web/style.css"><script defer src="/web/app.js"></script></head><body>
<header><div class="wrap brand"><span class="logo" aria-hidden="true">✚</span><div><strong>SDM Clínica</strong><small>Sistema de gestão veterinária</small></div><span class="pill" id="who">Ambiente de demonstração</span><button id="logout" type="button" hidden>Sair</button></div></header>
<main class="wrap"><div id="notice" aria-live="polite" hidden></div>
<section id="login" class="card login"><p class="eyebrow">ÁREA DO VETERINÁRIO</p><h1>Entre para começar</h1>
<div class="toolbar" id="authTabs"><button type="button" data-f="loginForm" class="secondary">Entrar</button><button type="button" data-f="registroForm" class="secondary">Criar conta</button><button type="button" data-f="confirmaForm" class="secondary">Confirmar código</button></div>
<form id="loginForm"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label><button>Entrar</button></form>
<form id="registroForm" hidden><label>Nome<input name="nome" required minlength="3"></label><label>CPF<input name="cpf" required inputmode="numeric" placeholder="000.000.000-00"></label><label>CRMV (número)<input name="crmv_numero" required></label><label>UF do CRMV<input name="crmv_uf" required maxlength="2" placeholder="RJ"></label><label>E-mail<input name="email" type="email" required></label><label>Telefone<input name="telefone"></label><label>Senha (mín. 8)<input name="senha" type="password" minlength="8" autocomplete="new-password" required></label><button>Criar conta</button></form>
<form id="confirmaForm" hidden><label>E-mail<input name="email" type="email" required></label><label>Código de 6 dígitos<input name="codigo" required pattern="\d{6}" maxlength="6" inputmode="numeric"></label><button>Confirmar</button><button type="button" class="secondary" id="reenviar">Reenviar código</button></form>
<p class="hint">Acesso local de teste: demo@clinica.local / ClinicaDemo!26</p></section>
<div id="workspace" hidden><nav id="nav" aria-label="Seções do sistema"></nav><section id="screen" class="card" aria-labelledby="title"></section></div></main>
<footer class="wrap">SDM • Projeto acadêmico • Serviço governamental simulado</footer></body></html>
